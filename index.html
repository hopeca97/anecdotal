<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASRS Offline — Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#2563EB;--primary-dark:#1D4ED8;--primary-light:#EFF6FF;
  --danger:#EF4444;--warning:#F59E0B;--text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --font:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0F172A 0%,#1E293B 50%,#0F172A 100%);
  padding:20px;position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 50%,rgba(37,99,235,.15) 0%,transparent 50%),
             radial-gradient(circle at 80% 20%,rgba(139,92,246,.15) 0%,transparent 50%);
}
.auth-card{
  background:rgba(30,41,59,.95);border:1px solid rgba(255,255,255,.1);
  border-radius:24px;padding:48px 40px;width:100%;max-width:470px;
  box-shadow:0 25px 60px rgba(0,0,0,.6);position:relative;z-index:1;
  backdrop-filter:blur(20px);animation:slideUp .5s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.auth-logo{
  width:72px;height:72px;background:transparent;
  border-radius:0;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;
  box-shadow:none;overflow:hidden;padding:0;
}
.auth-logo img{
  width:100%;height:100%;object-fit:contain;display:block;
}
.auth-title{text-align:center;margin-bottom:24px}
.auth-title h1{font-size:1.25rem;font-weight:800;color:#F1F5F9}
.auth-title p{font-size:.82rem;color:#64748B;margin-top:6px}
.auth-input{
  width:100%;padding:12px 16px;background:rgba(255,255,255,.05);
  border:2px solid rgba(255,255,255,.1);border-radius:10px;color:#F1F5F9;
  font-size:.92rem;outline:none;transition:all .25s;font-family:var(--font);margin-bottom:14px;
}
.auth-input:focus{border-color:#2563EB;background:rgba(37,99,235,.1);box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.auth-input::placeholder{color:#475569;font-size:.87rem}
.btn-auth{
  width:100%;padding:14px;background:linear-gradient(135deg,#2563EB,#7C3AED);
  border:none;border-radius:10px;color:#fff;font-size:.95rem;font-weight:700;
  cursor:pointer;transition:all .25s;letter-spacing:.5px;margin-bottom: 12px;
}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,.4)}
.btn-auth-secondary{
  width:100%;padding:12px;background:rgba(255,255,255,.05);
  border:2px solid rgba(255,255,255,.1);border-radius:10px;color:#94A3B8;font-size:.9rem;font-weight:600;
  cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
}
.btn-auth-secondary:hover{background:rgba(255,255,255,.1);color:#F1F5F9;border-color:rgba(255,255,255,.2)}
#offlineBannerLogin {
  background: var(--warning);
  color: #1E293B;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 8px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
}
</style>
</head>
<body>

<div class="auth-card">
  <div id="offlineBannerLogin"><i class="fas fa-wifi-slash"></i> Offline Mode: Authenticating locally.</div>
  <div class="auth-logo"><img src="hcalogo.png" alt="Logo"></div>
  <div class="auth-title">
    <h1>Anecdotal Student Record System</h1>
    <p>Sign in using your assigned system account</p>
  </div>

  <div>
    <input type="text" id="loginUsername" class="auth-input" placeholder="Username">
    <input type="password" id="loginPassword" class="auth-input" placeholder="Password" onkeydown="if(event.key==='Enter')handleLogin()">
    <button class="btn-auth" onclick="handleLogin()">Sign In</button>
    <a href="learner_calendar.html" class="btn-auth-secondary"><i class="fas fa-calendar-alt"></i> View School Calendar (Learners)</a>
  </div>
  <div id="authMsg" style="text-align:center;margin-top:14px;font-size:.82rem;font-weight:600;color:var(--danger)"></div>
</div>

<script>
const SUPABASE_URL = 'https://uhitjeeahlgwterhqfgo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoaXRqZWVhaGxnd3RlcmhxZmdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjA0MzgsImV4cCI6MjEwMTIzNjQzOH0.MQW5kELZubExKKU5PLx69Uc7BfxDDYf8k-jvo1aL2fI';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let localDB = null;

function initLocalDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('ASRS_OfflineDB', 2);
    request.onerror = event => reject(event.target.error);
    request.onsuccess = event => {
      localDB = event.target.result;
      resolve(localDB);
    };
    request.onupgradeneeded = event => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('hca_learners')) {
        db.createObjectStore('hca_learners', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('hca_users')) {
        db.createObjectStore('hca_users', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('sync_queue')) {
        db.createObjectStore('sync_queue', { keyPath: 'id', autoIncrement: true });
      }
    };
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  try {
    await initLocalDB();
  } catch (err) {
    console.error("Failed to initialize local IndexedDB:", err);
  }
});

async function handleLogin(event) {
  if (event && typeof event.preventDefault === 'function') {
    event.preventDefault();
  }

  // Updated to match your exact element IDs: loginUsername and loginPassword
  const usernameEl = document.getElementById('loginUsername');
  const passwordEl = document.getElementById('loginPassword');

  if (!usernameEl || !passwordEl) {
    alert("System error: Login inputs ('loginUsername' or 'loginPassword') not found.");
    return;
  }

  const usernameInput = usernameEl.value.trim();
  const passwordInput = passwordEl.value.trim();

  if (!usernameInput || !passwordInput) {
    alert("Please enter both username and password.");
    return;
  }

  // 1. Try Online via Supabase first if connected
  if (!navigator.onLine) {
      // OFFLINE LOGIN: Check the cached database
      const cachedUsers = LocalCache.get('hca_users') || [];
      const user = cachedUsers.find(u => u.username === username && u.password === password);
      
      if (user) {
          window.location.href = `dashboard.html?user_id=${user.id}`;
      } else {
          alert("Invalid credentials or user not found in offline database.");
      }
      return;
  }

  // 2. Fallback to Local IndexedDB when offline
  try {
    if (!localDB) await initLocalDB();
    const user = await findUserInLocalDB(usernameInput, passwordInput);
    if (user) {
      window.location.href = `main_dashboard.html?user_id=${user.id}`;
    } else {
      alert("Invalid username or password, or user data not cached for offline access.");
    }
  } catch (err) {
    console.error("Local login error:", err);
    alert("Login failed. Make sure you have signed in at least once online before using offline mode.");
  }
}

function saveUserLocally(user) {
  return new Promise((resolve, reject) => {
    const transaction = localDB.transaction(['hca_users'], 'readwrite');
    const store = transaction.objectStore('hca_users');
    store.put(user);
    transaction.oncomplete = () => resolve(true);
    transaction.onerror = e => reject(e.target.error);
  });
}

function findUserInLocalDB(username, password) {
  return new Promise((resolve, reject) => {
    const transaction = localDB.transaction(['hca_users'], 'readonly');
    const store = transaction.objectStore('hca_users');
    const request = store.getAll();

    request.onsuccess = () => {
      const users = request.result || [];
      const matchedUser = users.find(u => u.username === username && u.password === password);
      resolve(matchedUser || null);
    };
    request.onerror = e => reject(e.target.error);
  });
}
</script>
</body>
</html>
